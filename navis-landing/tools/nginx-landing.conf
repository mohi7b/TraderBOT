# NAVIS landing - ISOLATED, OPTIONAL Nginx vhost on port 8080.
#
# Nothing uses this file until you enable it yourself:
#
#   sudo cp tools/nginx-landing.conf /etc/nginx/sites-available/landing
#   sudo ln -s /etc/nginx/sites-available/landing /etc/nginx/sites-enabled/landing
#   sudo nginx -t && sudo systemctl reload nginx
#
# Safety notes (this is why it cannot clash with the Sanaei panel):
#   * It is a plain `server` block on a dedicated port - no `default_server`,
#     no `server_name` that could hijack an existing vhost, no `include`
#     changes, no edits to any existing file in sites-available/enabled.
#   * Before enabling it, make sure nothing else listens on 8080
#     (`ss -ltnp | grep :8080`) and that /etc/nginx has no other `listen 8080`.
#   * To revert: remove the symlink and `sudo nginx -t && sudo systemctl reload nginx`.
#
# Use one option or the other, not both: this vhost and `tools/serve.cjs`
# cannot bind the same port at the same time.

server {
    listen 8080;
    listen [::]:8080;
    # listen 8080 default_server;   # <- do NOT add this, it could affect other vhosts
    server_name _;

    # Absolute path to the landing folder.
    root /home/mohsen/TraderBOT/navis-landing;
    index index.html;

    # Never publish the tooling folder.
    location ^~ /tools/ { return 404; }
    location = /README.md { return 404; }
    location = /legacy-script.sha256.json { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Dedicated log files so the panel's logs stay untouched.
    access_log /var/log/nginx/landing.access.log;
    error_log  /var/log/nginx/landing.error.log;
}
